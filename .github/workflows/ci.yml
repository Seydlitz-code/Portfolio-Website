# CI: master에 들어가기 전에 작업 브랜치·PR에서 검사한다.
#  1) merge-check : 최신 master와 병합 충돌이 없는지
#  2) static      : JS 문법·TypeScript 타입·운영 의존성 보안 감사
#  3) integration : wrangler dev(로컬 D1·R2)로 Worker를 띄워 HTTP 통합 테스트
#  4) browser     : 헤드리스 Chrome으로 JS 오류·CSP 위반·작성 흐름
# 배포는 CI가 아니라 `npm run deploy`(wrangler)로 한다. master 직접 push에서는 돌지 않는다.
name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merge-check:
    name: master 병합 충돌 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 최신 master와 시험 병합
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch --no-tags origin master
          behind=$(git rev-list --count HEAD..origin/master)
          echo "master보다 뒤처진 커밋: ${behind}"
          if git merge --no-commit --no-ff origin/master; then
            echo "충돌 없음"
            git merge --abort 2>/dev/null || true
          else
            echo "::error::master와 병합 충돌이 있습니다. 충돌 파일:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

  static:
    name: 정적 검사·타입·의존성 감사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci
      - name: JS 문법
        run: npm run lint
      - name: TypeScript 타입 검사
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: 운영 의존성 보안 감사 (high 이상이면 실패)
        # 앞 단계가 실패해도 감사 결과까지 한 번에 보이도록 계속 실행 (npm ci 실패 시는 제외)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: 통합 테스트 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: 테스트 (로컬 D1·R2로 wrangler dev 기동)
        run: npm test

  browser:
    name: 브라우저 테스트 (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chrome 경로 확인
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "Chrome: ${CHROME}"
          "${CHROME}" --version
          echo "CHROME_PATH=${CHROME}" >> "$GITHUB_ENV"
      - name: 테스트
        run: npm run test:browser
