# Render: 영구 디스크 mountPath와 DATA_DIR을 반드시 동일하게 두세요. 그렇지 않으면 배포마다 DB가 비는 것처럼 보일 수 있습니다.
# (이전에 "db" 폴더에 마운트하면 db/database.js가 가려져 Cannot find module 오류가 납니다.)
# 대시보드만으로 만든 서비스: Disk 추가 후 Environment에 DATA_DIR = 디스크 mount 경로.
services:
  - type: web
    name: portfolio-lilip
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: portfolio-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
